name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Reconcile parser regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML
        run: python -m pip install PyYAML==6.0.3

      # Every scripts/test_*.py is discovered and run here — a new suite needs
      # no edit to this file. See scripts/run_tests.py; it prints a per-suite
      # PASS/FAIL summary and annotates the failing file.
      - name: Run Python regression suites (discovered from scripts/test_*.py)
        run: python3 scripts/run_tests.py

      - name: Run extension thin-client state test (node)
        run: node editors/antigravity/test_state.js

      - name: Smoke-test init_polis.py
        run: |
          mkdir -p /tmp/smoke
          python3 scripts/init_polis.py \
            --project-root /tmp/smoke \
            --agent-id smoke-test-citizen \
            --vendor anthropic \
            --model claude-opus-4-7 \
            --tool "ci runner" \
            --project-name "CI Smoke"
          test -f /tmp/smoke/_polis/CONSTITUTION.md
          test -f /tmp/smoke/_polis/citizens/smoke-test-citizen/capability_card.yml
          test -f /tmp/smoke/CLAUDE.md
          test -f /tmp/smoke/AGENTS.md
          test -f /tmp/smoke/GEMINI.md

      - name: Idempotency check
        run: |
          python3 scripts/init_polis.py \
            --project-root /tmp/smoke \
            --agent-id smoke-test-citizen \
            --vendor anthropic \
            --model claude-opus-4-7 \
            --tool "ci runner" \
            --project-name "CI Smoke" \
            > /tmp/run2.log
          # Re-running with the same agent-id should mark all files as "exists" (no overwrite).
          ! grep -E '^\s*\+ ' /tmp/run2.log

      - name: Invalid agent-id is rejected before any disk write
        run: |
          ! python3 scripts/init_polis.py \
            --project-root /tmp/smoke \
            --agent-id BAD \
            --vendor anthropic \
            --model x --tool x --project-name x 2>/dev/null

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  required-checks:
    name: Required checks
    if: always()
    needs:
      - test
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Verify all required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -eu
          test "$TEST_RESULT" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = "success"
          else
            test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
          fi
